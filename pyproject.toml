[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "business-signals"
version = "0.1.0"
description = "Agentic business root-cause investigations across independent data sources"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Business Signals contributors" }]
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain-core>=0.3.75,<2",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-postgres>=2.0,<4",
  "langsmith>=0.13,<1",
  "openai>=1.109,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.1,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "sqlglot>=27.14,<30",
  "sse-starlette>=2.4,<4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/business_signals"]

[tool.hatch.build.targets.wheel.force-include]
"apps/api/src/business_signals/prompts" = "business_signals/prompts"

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
